<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Restricted Area</title>
    <style>
        body {
            background-color: #111;
            /* Dark background */
            color: #0f0;
            /* Hacker green text */
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-box {
            text-align: center;
            border: 1px solid #333;
            padding: 40px;
            border-radius: 8px;
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }

        input {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            width: 150px;
            margin: 20px 0;
            outline: none;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
        }

        button:hover {
            background: #0c0;
        }

        #error-msg {
            color: red;
            font-size: 12px;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="auth-box">
        <h2>Enter Access Code</h2>
        <input type="password" id="secretCode" maxlength="4" placeholder="****">
        <br>
        <button onclick="verifyCode()">Verify</button>
        <p id="error-msg">ACCESS DENIED. INCORRECT CODE.</p>
    </div>

    <script>
        function verifyCode() {
            let code = document.getElementById('secretCode').value;
            if (code === '9876') {
                // Success: Redirect to Admin Dashboard
                window.location.href = 'admin.html';
            } else {
                // Failure: Show error and clear input
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('secretCode').value = '';
            }
        }

        // Allow pressing "Enter" key to submit
        document.getElementById('secretCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { verifyCode(); }
        });
    </script>
</body>

</html>
