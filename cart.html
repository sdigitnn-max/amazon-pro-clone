<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amazon.in Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadCart()">

    <!-- 1. NAVBAR -->
    <header class="navbar">
        <div class="nav-item nav-logo">
            <h2>amazon<span>.in</span></h2>
        </div>
        <div class="nav-search">
            <input type="text" class="search-input">
            <button class="search-btn">🔍</button>
        </div>
        <div class="nav-right">
            <a href="home.html" style="color: white; margin-right: 20px;">Home</a>
            <a href="#" class="nav-item nav-cart">
                <span id="cart-count"
                    style="color:#f08804; font-size:18px; font-weight:bold; margin-right:5px;">0</span>
                <span class="nav-text-bold">Cart</span>
            </a>
            <!-- YAHAN SE CHANGE KARIYE -->
            <a href="index.html" class="nav-item" id="account-link" style="text-decoration: none;">
                <span class="nav-text-small" id="user-display">Hello, sign in</span>
                <span class="nav-text-bold">Account & Lists</span>
            </a>
            <!-- YAHAN TAK -->
        </div>
    </header>

    <!-- 2. CART MAIN LAYOUT -->
    <div class="cart-layout">

        <!-- Left Side: Items List -->
        <div class="cart-left">
            <div
                style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
                <div>
                    <h2 style="font-weight: 400; font-size: 28px;">Shopping Cart</h2>
                    <a href="#" style="font-size: 14px; color: #007185;">Deselect all items</a>
                </div>
                <span style="color: #565959; font-size: 14px;">Price</span>
            </div>

            <!-- Items yahan JavaScript se load honge -->
            <div id="cart-items"></div>

            <!-- Left Side Subtotal -->
            <div style="text-align: right; padding-top: 15px; font-size: 18px;">
                Subtotal (<span id="cart-item-count">0</span> items): <span style="font-weight: bold;">₹<span
                        id="cart-subtotal-bottom">0</span></span>
            </div>
        </div>

        <!-- Right Side: Buy Box with Address -->
        <div class="cart-right">

            <!-- Free Delivery Info Box -->
            <div
                style="margin-bottom: 15px; padding: 10px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 4px; font-size: 14px; color: #007600;">
                <span style="font-size: 16px;">✅</span> Your order is eligible for FREE Delivery.
            </div>

            <div style="font-size: 18px; margin-bottom: 15px;">
                Subtotal (<span id="right-item-count">0</span> items): <span style="font-weight: bold;">₹<span
                        id="cart-subtotal-right">0</span></span>
            </div>

            <!-- Address Input Field -->
            <div style="margin-bottom: 20px;">
                <label style="font-size: 14px; font-weight: bold;">📍 Delivery Address:</label>
                <textarea id="delivery-address" placeholder="Enter Full Address (House No, Street, City, Pincode)"
                    style="width: 100%; height: 60px; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; resize: none;"></textarea>
            </div>

            <button class="btn-yellow" onclick="proceedToBuy()">Proceed to Buy</button>

            <div style="margin-top: 15px; border: 1px solid #ddd; border-radius: 4px; padding: 10px;">
                <p style="font-size: 14px; font-weight: bold;">EMI Available</p>
                <p style="font-size: 12px; color: #565959;">No Cost EMI available on selected cards.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
