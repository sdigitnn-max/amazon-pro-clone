<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Amazon Ember", Arial, sans-serif;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .content-wrapper {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 50px;
        }

        .logo {
            margin-bottom: 20px;
            text-align: center;
        }

        .logo h2 {
            font-size: 32px;
            font-weight: bold;
            color: #131921;
            letter-spacing: -1px;
        }

        .logo span {
            color: #ff9900;
        }

        .login-box {
            width: 350px;
            padding: 25px 30px;
            border: 1px solid #e7e7e7;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            background: #fff;
        }

        .login-box h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .login-box label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .login-box input:focus {
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgb(228 121 17 / 50%);
        }

        .continue-btn {
            width: 100%;
            background-color: #ffd814;
            border: 1px solid #fcd200;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .continue-btn:hover {
            background-color: #f7ca00;
        }

        .legal-text {
            font-size: 12px;
            color: #111;
            line-height: 1.5;
            text-align: left;
        }

        .legal-text a {
            color: #0066c0;
            text-decoration: none;
        }

        .legal-text a:hover {
            text-decoration: underline;
            color: #c45500;
        }

        /* Updated Footer Layout */
        .footer {
            flex-shrink: 0;
            border-top: 1px solid #e7e7e7;
            background: linear-gradient(to bottom, #fbfbfb, #f3f3f3);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-links {
            display: flex;
            gap: 25px;
        }

        .footer-links a {
            font-size: 11px;
            color: #0066c0;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
            color: #c45500;
        }

        .copyright-container {
            text-align: right;
        }

        .copyright {
            font-size: 11px;
            color: #555;
        }

        /* SECRET DOT STYLING */
        .secret-link {
            color: #555;
            text-decoration: none;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="content-wrapper">
        <div class="logo">
            <h2>amazon<span>.in</span></h2>
        </div>

        <div class="login-box">
            <h1>Sign in</h1>
            <form id="login-form">
                <!-- Naya field Name ke liye -->
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="e.g. Rahul" required>

                <label for="userEmail">Email or mobile phone number</label>
                <input type="text" id="userEmail" required>

                <button type="submit" class="continue-btn">Continue</button>
            </form>
            <p class="legal-text">
                By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy
                    Notice</a>.
            </p>
        </div>
    </div>

    <!-- Updated Footer with Secret Link Intact -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <div class="copyright-container">
            <!-- Yahan affiliates ke end me . secret link hamesha ki tarah chhipa hua hai -->
            <p class="copyright">© 1996-2026, Amazon.com, Inc. or its affiliates<a href="secret.html"
                    class="secret-link">.</a></p>
        </div>
    </footer>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            // Name aur Email dono nikal kar save kar rahe hain
            let name = document.getElementById('userName').value;
            let email = document.getElementById('userEmail').value;

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', name);
            localStorage.setItem('userEmail', email);

            // Redirect to Home Page
            window.location.href = 'home.html';
        });
    </script>
</body>

</html>
