<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Orders - Amazon.in</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .order-card {
            border: 1px solid #d5d9d9;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            background: white;
        }

        .order-header {
            background: #f0f2f2;
            padding: 15px;
            border-bottom: 1px solid #d5d9d9;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #565959;
        }

        .order-body {
            padding: 20px;
        }

        .product-list {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .product-list img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .product-info {
            max-width: 400px;
        }

        .track-container {
            position: relative;
            margin: 40px 20px 60px 20px;
            display: flex;
            justify-content: space-between;
        }

        .track-bg-line {
            position: absolute;
            top: 10px;
            left: 0;
            height: 4px;
            background: #e0e0e0;
            width: 100%;
            z-index: 1;
        }

        .track-glow-line {
            position: absolute;
            top: 10px;
            left: 0;
            height: 4px;
            background: #007600;
            z-index: 2;
            transition: 1s ease-in-out;
            box-shadow: 0 0 10px #007600;
        }

        .track-step {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step-dot {
            width: 24px;
            height: 24px;
            background: white;
            border: 4px solid #e0e0e0;
            border-radius: 50%;
            transition: 0.5s;
        }

        .track-step.active .step-dot {
            border-color: #007600;
            background: #007600;
            box-shadow: 0 0 15px #007600;
        }

        .step-label {
            position: absolute;
            top: 30px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            width: 100px;
            color: #555;
        }

        .step-date {
            font-size: 11px;
            font-weight: normal;
            color: #888;
            display: block;
            margin-top: 3px;
        }

        .track-step.active .step-label {
            color: #007600;
        }
    </style>
</head>

<body onload="loadUserOrders()">
    <header class="navbar">
        <div class="nav-item nav-logo">
            <h2>amazon<span>.in</span></h2>
        </div>
        <div class="nav-right" style="margin-left: auto;">
            <a href="home.html" style="color: white; margin-right: 20px;">Home</a>
            <a href="cart.html" class="nav-item nav-cart" style="text-decoration: none;">
                <span id="cart-count">0</span><span class="nav-text-bold">Cart</span>
            </a>
        </div>
    </header>

    <div style="max-width: 1000px; margin: 40px auto; padding: 20px;">
        <h1 style="font-weight: 400; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">Your
            Orders</h1>
        <div id="orders-container">Loading...</div>
    </div>

    <script src="script.js"></script>
    <script>
        function loadUserOrders() {
            let container = document.getElementById('orders-container');
            try {
                let currentUser = localStorage.getItem('userName');

                // Agar user login nahi hai toh roko
                if (!currentUser) {
                    container.innerHTML = "<p style='font-size:16px; color:#555;'>Please Sign In to view your orders.</p>";
                    return;
                }

                let allOrders = JSON.parse(localStorage.getItem('allOrders')) || [];

                // SIRF usi user ke orders filter karo jo abhi login hai
                let userOrders = allOrders.filter(order => order.userName === currentUser).reverse();

                if (userOrders.length === 0) {
                    container.innerHTML = "<p style='font-size:16px; color:#555;'>You have no recent orders.</p>";
                    return;
                }

                container.innerHTML = "";
                userOrders.forEach(order => {
                    let status = order.status || 0;
                    let lineWidth = (status / 3) * 100;
                    let itemsHTML = "";

                    if (order.items && Array.isArray(order.items) && order.items.length > 0) {
                        order.items.forEach(item => {
                            if (!item || !item.name) return;
                            itemsHTML += `
                                <div class="product-list">
                                    <img src="${item.img || ''}" alt="Product">
                                    <div class="product-info">
                                        <h3 style="color: #007185; font-size: 14px; margin-bottom:5px;">${item.name}</h3>
                                        <p style="font-size: 12px; font-weight:bold;">Qty: ${item.qty} | ₹${item.price}</p>
                                    </div>
                                </div>`;
                        });
                    } else {
                        itemsHTML = "<p>Items information unavailable.</p>";
                    }

                    container.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <div><strong>ORDER PLACED</strong><br>${order.orderDate || 'N/A'}</div>
                                <div><strong>TOTAL</strong><br>₹${parseFloat(order.totalAmount || 0).toLocaleString('en-IN')}</div>
                                <div><strong>PAYMENT METHOD</strong><br>${order.paymentMethod || 'Unknown'}</div>
                                <div style="text-align: right;"><strong>ORDER ID</strong><br>${order.orderId || 'N/A'}</div>
                            </div>
                            <div class="order-body">
                                <h3 style="color: #007600; margin-bottom: 20px; font-size: 18px;">
                                    ${status === 3 ? 'Delivered' : 'Arriving by ' + (order.deliveryDate || 'Soon')}
                                </h3>
                                ${itemsHTML}
                                <p style="font-size: 13px; color: #555;"><strong>Delivery Address:</strong> ${order.address || 'N/A'}</p>

                                <div class="track-container">
                                    <div class="track-bg-line"></div>
                                    <div class="track-glow-line" style="width: ${lineWidth}%;"></div>
                                    <div class="track-step ${status >= 0 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Ordered</div></div>
                                    <div class="track-step ${status >= 1 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Shipped</div></div>
                                    <div class="track-step ${status >= 2 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Out for Delivery</div></div>
                                    <div class="track-step ${status >= 3 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Delivered</div></div>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (error) {
                console.error("Order loading failed:", error);
                container.innerHTML = "<p>Error loading orders. Please clear browser cache and try again.</p>";
            }
        }
    </script>
</body>

</html>
